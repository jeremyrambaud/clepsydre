name: Website Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/website-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve base path
        shell: bash
        run: |
          if [[ -n "${{ vars.GH_PAGES_BASE_PATH }}" ]]; then
            BASE_PATH="${{ vars.GH_PAGES_BASE_PATH }}"
          elif [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${{ github.event.repository.name }}/"
          fi

          if [[ "${BASE_PATH:0:1}" != "/" ]]; then
            BASE_PATH="/${BASE_PATH}"
          fi

          if [[ "${BASE_PATH}" != "/" && "${BASE_PATH: -1}" != "/" ]]; then
            BASE_PATH="${BASE_PATH}/"
          fi

          echo "VITE_BASE_PATH=${BASE_PATH}" >> "$GITHUB_ENV"
          echo "Using base path: ${BASE_PATH}"

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build website
        working-directory: website
        run: bun run build

      - name: Ensure GitHub Pages compatibility
        run: touch website/dist/client/.nojekyll

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
