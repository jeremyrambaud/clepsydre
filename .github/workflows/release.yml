name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxss-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clepsydre ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.platform == 'windows-latest' && contains(github.ref_name, '-') && '--bundles nsis' || matrix.args }}

  package-extensions:
    name: Package browser extensions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package extension bundles
        env:
          EXT_VERSION: ${{ github.ref_name }}
        run: bash ./scripts/package-extensions.sh

      - name: Upload extension bundles to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/extensions/*.zip \
            --repo "${{ github.repository }}" \
            --clobber

  publish-beta-pointer:
    name: Publish latest-beta pointer
    if: contains(github.ref_name, '-beta.')
    needs: [build, package-extensions]
    runs-on: ubuntu-latest
    steps:
      - name: Download release updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/clepsydre-beta
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "latest.json" --dir /tmp/clepsydre-beta

      - name: Create or update latest-beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-beta --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest-beta /tmp/clepsydre-beta/latest.json --repo "${{ github.repository }}" --clobber
            gh release edit latest-beta --repo "${{ github.repository }}" --title "Latest Beta Channel" --notes "Automatically updated from ${{ github.ref_name }}" --prerelease
          else
            gh release create latest-beta /tmp/clepsydre-beta/latest.json --repo "${{ github.repository }}" --title "Latest Beta Channel" --notes "Automatically updated from ${{ github.ref_name }}" --prerelease
          fi

  publish-stable-pointer:
    name: Publish latest-stable pointer
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [build, package-extensions]
    runs-on: ubuntu-latest
    steps:
      - name: Download release updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/clepsydre-stable
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "latest.json" --dir /tmp/clepsydre-stable

      - name: Create or update latest-stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-stable --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest-stable /tmp/clepsydre-stable/latest.json --repo "${{ github.repository }}" --clobber
            gh release edit latest-stable --repo "${{ github.repository }}" --title "Latest Stable Channel" --notes "Automatically updated from ${{ github.ref_name }}"
          else
            gh release create latest-stable /tmp/clepsydre-stable/latest.json --repo "${{ github.repository }}" --title "Latest Stable Channel" --notes "Automatically updated from ${{ github.ref_name }}"
          fi
