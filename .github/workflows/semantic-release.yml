name: Semantic Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')) && (github.event_name != 'workflow_dispatch' || github.ref_name == 'beta' || github.ref_name == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24.10.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git to use PAT
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.SEMANTIC_RELEASE_PAT }}@github.com/${{ github.repository }}.git"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          SEMANTIC_RELEASE_DRAFT: ${{ github.ref_name == 'beta' && 'true' || 'false' }}
          SEMANTIC_RELEASE_CHANNEL_LABEL: ${{ github.ref_name == 'beta' && 'Beta' || 'Stable' }}
        run: bun run release:ci
