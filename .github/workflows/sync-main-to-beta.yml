name: Sync main to beta

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-main-into-beta:
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '-')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git to use PAT
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.SEMANTIC_RELEASE_PAT }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into beta
        run: |
          set -euo pipefail

          git fetch origin main beta --tags
          git checkout -B beta origin/beta

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "beta already contains main"
            exit 0
          fi

          git merge --no-ff origin/main -m "chore(sync): merge main into beta [skip ci]"
          git push origin HEAD:beta
